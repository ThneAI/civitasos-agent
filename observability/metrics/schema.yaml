# Raw Tick CSV Schema — F.0.a v1.10
# 与 README.md 中的「Raw Tick CSV」表格一一对应，作为 schema.py 的真值来源。
# 修改本文件需同步更新 schema.py 与 test_schema.py。
# v1.1 变更：mode/wait_references_telos 改 optional，final_metrics M5 拆 tick/task 层 与 M6 重命名，M4 标 nullable。
# v1.2 变更：新增 lessons_count（每 tick 可见 lessons 数）支持 M4 可计算化。
# v1.3 变更：新增 institutional identity 观测列（identity_state / remaining_epochs / prompt_injected）。
# v1.4 变更：新增 G.2 subjective-time 与 LLM 自主 waiting/deep_think 选择观测列。
# v1.5 变更：final_metrics 新增 G.2 mode-choice 聚合指标。
# v1.6 变更：新增 G.3 relation memory / cross-agent time consistency 空载观测列与聚合列。
# v1.7 变更：新增 G.3 relation_context_source，用于区分 backend read model 与 synthetic context。
# v1.8 变更：新增 H.0 IEM / expectation trace skeleton 空载观测列与聚合列。
# v1.9 变更：新增 G.3.5 R2R relation id、relation_pair、relation-pair failure ref provenance 观测列与聚合列。
# v1.10 变更：新增 H0-C identity/evolution observability：identity action bias、constitutional surprise、governance trigger、predicted update、desired slow drift。

schema_version: "1.10"
artifact: "raw_tick"

columns:
  - name: run_id
    type: string
    required: true
    source: run_baseline.sh 启动时 uuid

  - name: agent_id
    type: string
    required: true
    source: civitas-runtime agent name

  - name: task_id
    type: string
    required: true
    source: benchmarks/v1 manifest task id（CollectorAdapter.bind_task 注入）
    constraint: 必须能在 manifest.yaml 中找到

  - name: tick_seq
    type: int
    required: true
    source: CollectorAdapter 内部计数（每次 bind_task 重置为 0）
    constraint: ">= 1"

  - name: tick_id
    type: string
    required: true
    source: TickContext.tick_id

  - name: timestamp
    type: iso8601
    required: true
    source: TickContext.timestamp

  - name: phase_reached
    type: enum
    required: true
    values: [perceive, recall, expect, decide, conscience, act, evaluate, reflect, remember]
    source: TickContext.phase

  - name: decision_action
    type: string
    required: false
    source: Decision.action（无 decision 则为空）

  - name: decision_source
    type: enum
    required: false
    values: [rules, llm, hybrid]
    source: Decision.source

  - name: decision_reasoning
    type: string
    required: false
    source: Decision.reasoning（截断 500 字符）

  - name: served_intent_layer
    type: string
    required: false
    source: H.1 之后 Decision 自报；F.1 阶段写空字符串

  - name: conscience_allowed
    type: bool
    required: false
    source: ConscienceVerdict.allowed

  - name: conscience_reason
    type: string
    required: false
    source: ConscienceVerdict.reason

  - name: eval_success
    type: bool
    required: false
    source: Evaluation.success

  - name: eval_cost
    type: float
    required: false
    source: Evaluation.cost

  - name: eval_duration_ms
    type: int
    required: false
    source: Evaluation.duration_ms

  - name: aspect_gap
    type: float
    required: true
    source: EnergyState.aspect_gap
    constraint: "0.0 <= x <= 1.0"

  - name: peer_trust_avg
    type: float
    required: true
    source: EnergyState.peer_trust_avg

  - name: balance
    type: float
    required: true
    source: EnergyState.balance

  - name: identity_state
    type: enum
    required: false
    values: [UNKNOWN, PROVISIONAL, CIVITAS_IDENTITY, LIQUIDATED]
    source: "briefing.identity.state（II-1 institutional identity 摘要）"

  - name: identity_remaining_epochs
    type: int
    required: false
    source: "briefing.identity.remaining_epochs（若可计算）"

  - name: identity_prompt_injected
    type: bool
    required: false
    source: "本 tick 是否将 institutional identity 摘要注入 system prompt"

  - name: mode
    type: enum
    required: false
    values: [active, idle, sleeping, waiting, deep_think, event]
    source: '当前 LoopMode；无法读取 runtime 真值时采集器默认写 "active"'

  - name: is_wait
    type: bool
    required: true
    source: Decision.action == "wait"

  - name: lessons_count
    type: int
    required: false
    source: "本地/远程 memory 中 lessons_learned 的长度快照（每 tick 采样）"

  - name: wait_references_telos
    type: bool
    required: false
    source: 'F.0 阶段固定 false（M6 已弱化为 wait_ratio）；H.1 后基于 served_intent_layer 重新计算'

  - name: subjective_lifecycle_stage
    type: enum
    required: false
    values: [infant, juvenile, mature, elder]
    source: "briefing.subjective_time.lifecycle_stage（G.2 Agent 主观时间）"

  - name: subjective_recommended_mode
    type: enum
    required: false
    values: [active, idle, sleeping, waiting, deep_think, event]
    source: "briefing.subjective_time.recommended_mode（规则/LLM 选择后最终推荐模式）"

  - name: llm_mode_request
    type: enum
    required: false
    values: [waiting, deep_think]
    source: "LLM 文本或工具参数显式声明的 mode_request"

  - name: llm_mode_selected
    type: bool
    required: false
    source: "本 tick 是否由 LLM 自主选择 waiting/deep_think"

  - name: relation_context_id
    type: string
    required: false
    source: "G.3 relation context stable id（无 relation context 时为空）"

  - name: relation_memory_refs
    type: string
    required: false
    source: "G.3 决策引用的 relation memory / failure / challenge refs，多个 ref 用 ; 分隔"

  - name: time_window_id
    type: string
    required: false
    source: "G.3 同一 task/relation event 的跨 Agent 可比对时间窗口 id"

  - name: challenge_deadline_bucket
    type: string
    required: false
    source: "G.3 challenge_deadline_at 的稳定 bucket，用于跨 Agent 时间一致性检查"

  - name: relation_context_source
    type: enum
    required: false
    values: [backend_read_model, synthetic_benchmark]
    source: "G.3 relation_context 的来源；v2 nightly 要求 backend_read_model 覆盖 relation-aware raw rows"

  - name: relation_id_source
    type: enum
    required: false
    values: [r2r_registry, derived_fallback]
    source: "G.3.5 relation_id 来源；v2 nightly 要求 r2r_registry 覆盖 relation-aware raw rows"

  - name: relation_pair_present
    type: bool
    required: false
    source: "G.3.5 relation_context 是否携带 requester/worker relation_pair"

  - name: relation_pair_failure_source
    type: enum
    required: false
    values: [backend_relation_pair_read_model]
    source: "G.3.5 failure refs 查询来源；用于确认 failure memory 来自 relation-pair read model"

  - name: relation_pair_failure_events_present
    type: bool
    required: false
    source: "G.3.5 backend relation-pair failure read model 是否返回 failure events"

  - name: relation_pair_failure_ref_present
    type: bool
    required: false
    source: "G.3.5 存在 relation-pair failure events 时，relation_memory_refs 是否写入对应 failure ref"

  - name: h0_expectation_trace_present
    type: bool
    required: false
    source: "H.0：本 tick 是否产生 expectations/surprise/drive 任一 trace；H.0 未启用时为空/false"

  - name: h0_survival_surprise_present
    type: bool
    required: false
    source: "H.0：survival surprise trace 是否存在"

  - name: h0_economic_surprise_present
    type: bool
    required: false
    source: "H.0：economic surprise trace 是否存在"

  - name: h0_relation_surprise_present
    type: bool
    required: false
    source: "H.0：relation surprise trace 是否存在"

  - name: h0_drive_constitution_verdict_present
    type: bool
    required: false
    source: "H.0：drive trace 是否记录 constitution verdict"

  - name: h0_iem_update_log_present
    type: bool
    required: false
    source: "H.0：本 tick 是否生成 expectation_update_log / update candidate"

  - name: h0_relation_action_bias_present
    type: bool
    required: false
    source: "H.0：relation expectation 是否产生 action bias"

  - name: h0_normative_local_update_blocked
    type: bool
    required: false
    source: "H.0：Normative State 本地改写是否被 guard 阻止"

  - name: h0_identity_action_bias_present
    type: bool
    required: false
    source: "H0-C：survival/economic/normative identity expectation 是否产生 action bias"

  - name: h0_constitutional_surprise_present
    type: bool
    required: false
    source: "H0-C：constitutional / normative surprise trace 是否存在"

  - name: h0_normative_governance_trigger_present
    type: bool
    required: false
    source: "H0-C：Normative breach 是否只生成 governance trigger"

  - name: h0_predicted_update_present
    type: bool
    required: false
    source: "H0-C：Predicted State 是否生成 precision-weighted update"

  - name: h0_desired_slow_drift_present
    type: bool
    required: false
    source: "H0-C：Desired State 是否生成 slow trait drift update"

# ---------------------------------------------------------------------------
# Final Metrics CSV — computers/ 聚合输出
# ---------------------------------------------------------------------------
final_metrics:
  schema_version: "1.10"
  artifact: "final_metrics"
  columns:
    - {name: run_id, type: string, required: true}
    - {name: agent_id, type: string, required: true}
    - {name: category_id, type: string, required: true,
       constraint: 'matches /^[RVSAG]0[1-6]$/'}
    - {name: targets_disease, type: enum, required: true,
       values: [R, V, S, A, G]}
    - {name: task_count, type: int, required: true}
    - {name: m1_result_deviation_rate, type: float, required: true,
       constraint: '0.0 <= x <= 1.0',
       note: '仅统计 success_criteria 全为 regex/pyexpr 的任务；llm_judge 类型延到 H.1'}
    - {name: m2_verification_miss_rate, type: float, required: false,
       note: '仅 adversarial variant 有意义；依赖 task.verifier_tools 字段'}
    - {name: m3_aspect_gap_response_rate, type: float, required: true,
       constraint: '0.0 <= x <= 1.0',
       note: '阈值 θ=0.7、窗宽 N=3、Jaccard<0.5 为 F.0 经验值，F.1 后校准'}
    - {name: m4_lessons_impact_rate, type: float, required: false, nullable: true,
       note: 'H.2-lite：基于 raw tick 的 lessons_count + fail→success 恢复计算；无可计算样本时保持 null'}
    - {name: m5_tick_latency_p50_ms, type: float, required: true,
       note: 'per-tick 层，Evaluation.duration_ms 的 P50'}
    - {name: m5_tick_latency_p95_ms, type: float, required: true}
    - {name: m5_tick_latency_p99_ms, type: float, required: true}
    - {name: m5_task_latency_p50_ms, type: float, required: true,
       note: 'per-task 层，task 开始到首次 success/终止的 wall-clock'}
    - {name: m5_task_latency_p95_ms, type: float, required: true}
    - {name: m6_wait_ratio, type: float, required: true,
       constraint: '0.0 <= x <= 1.0',
       note: 'F.0 弱化版；H.1 后拆分为 idle_thinking_ratio + purposeful_wait_ratio'}
    - {name: g2_mode_choice_observable_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.2：LLM 显式 mode_request tick / wait tick；无 wait tick 时为 null'}
    - {name: g2_llm_waiting_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.2：LLM 显式选择 waiting / 所有显式 mode_request'}
    - {name: g2_llm_deep_think_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.2：LLM 显式选择 deep_think / 所有显式 mode_request'}
    - {name: g3_relation_memory_hit_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.3：relation-aware 任务中引用 relation memory / failure / challenge ref 的比例；无 relation-aware 任务时为 null'}
    - {name: g3_relation_aware_decision_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.3：relation-aware 任务中决策 trace 带 peer/relation-specific evidence 的比例；无 relation-aware 任务时为 null'}
    - {name: g3_cross_agent_time_consistency_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.3：本 agent 对 relation-aware 任务输出 time_window_id 的覆盖率；merge 阶段再做跨 Agent 一致性检查'}
    - {name: g3_r2r_relation_id_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.3.5：relation-aware 任务中 relation_id_source=r2r_registry 的比例；无 relation-aware 任务时为 null'}
    - {name: g3_relation_pair_context_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.3.5：relation-aware 任务中携带 requester/worker relation_pair 的比例；无 relation-aware 任务时为 null'}
    - {name: g3_relation_pair_failure_ref_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'G.3.5：存在 relation-pair failure events 的任务中写入对应 failure ref 的比例；无 failure events 时为 null'}
    - {name: h0_expectation_trace_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H.0：产生 expectation/surprise/drive trace 的 tick / total ticks；H.0 未启用时为 null'}
    - {name: h0_hard_domain_trace_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H.0：traced ticks 中 survival/economic/relation 三个硬性领域均有 surprise 的比例'}
    - {name: h0_drive_constitution_verdict_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H.0：traced ticks 中 drive trace 带 constitution verdict 的比例'}
    - {name: h0_iem_update_log_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H.0：traced ticks 中生成 IEM update log / candidate 的比例'}
    - {name: h0_relation_action_bias_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H.0：traced ticks 中 relation expectation 影响 action bias 的比例'}
    - {name: h0_normative_guard_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H.0：traced ticks 中 Normative local update 被 guard 阻止的比例'}
    - {name: h0_identity_domain_trace_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H0-C：traced ticks 中 survival/economic identity surprise 均存在的比例'}
    - {name: h0_identity_action_bias_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H0-C：traced ticks 中 identity expectation 产生 action bias 的比例'}
    - {name: h0_constitutional_surprise_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H0-C：traced ticks 中 constitutional / normative surprise trace 的比例'}
    - {name: h0_normative_governance_trigger_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H0-C：traced ticks 中 Normative breach 生成 governance trigger 的比例'}
    - {name: h0_predicted_update_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H0-C：traced ticks 中 Predicted State 生成 precision-weighted update 的比例'}
    - {name: h0_desired_slow_drift_ratio, type: float, required: false,
       constraint: '0.0 <= x <= 1.0',
       note: 'H0-C：traced ticks 中 Desired State 生成 slow drift update 的比例'}
    - {name: notes, type: string, required: false}
