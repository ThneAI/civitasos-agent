[project]
name = "civitasos-agent"
version = "0.1.0"
description = "CivitasOS Agent 示例 — 基于 civitasos-runtime 的自治 Agent 模板"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "civitasos-runtime[openai,gateway]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
